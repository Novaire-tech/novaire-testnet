name: Documentation Validation

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-required-docs:
    name: Check required documentation exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required files
        run: |
          set -uo pipefail
          required=(README.md CONTRIBUTING.md SECURITY.md LICENSE CHANGELOG.md RELEASE_NOTES.md)
          missing=()
          for f in "${required[@]}"; do
            if [[ ! -s "$f" ]]; then
              missing+=("$f")
            fi
          done
          {
            echo "# Documentation Validation Report"
            echo
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "All required documentation files present."
            else
              echo "Missing or empty required files:"
              for f in "${missing[@]}"; do echo "- $f"; done
            fi
          } | tee docs-validation-report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required docs: ${missing[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-validation-report
          path: docs-validation-report.md
