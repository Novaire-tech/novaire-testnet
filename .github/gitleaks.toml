title = "Novaire gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "stellar-secret-key"
description = "Stellar/Soroban secret seed (S...)"
regex = '''\bS[A-Z0-9]{55}\b'''
tags = ["key", "stellar"]

[[rules]]
id = "bip39-mnemonic"
description = "Hardcoded BIP39-shaped mnemonic/seed phrase"
regex = '''(?i)(mnemonic|seed[_ ]?phrase)\s*[:=]\s*["'][a-z]+( [a-z]+){10,23}["']'''
tags = ["key", "mnemonic"]

[allowlist]
regexes = [
  # Stellar public strkeys are not secrets: G = account, C = contract,
  # M = muxed account, L = liquidity pool. Only S (secret seed) is sensitive
  # and is caught by the stellar-secret-key rule above.
  '''\b[GCML][A-Z2-7]{55}\b''',
]
paths = [
  '''.*\.lock$''',
  '''package-lock\.json$''',
  '''\.env\.example$''',
  '''docs/.*\.md$''',
]
